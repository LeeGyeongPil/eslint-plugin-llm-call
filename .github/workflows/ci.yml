# Key-free: the plugin only reads source code, so tests, demo and pack smoke need no secrets.
# `npm run ci:repro` runs the same `run:` lines locally from a clean copy of the committed files.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday - catches breakage from new ESLint / TypeScript / SDK releases
  workflow_dispatch:
jobs:
  test:
    # vitest 5 needs Node >= 22.12; Node 20 is end-of-life, so the matrix is the supported majors.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run smoke:pack
